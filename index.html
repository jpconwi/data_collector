<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Room Records</title>
<style>
:root{--ink:#1b2733;--muted:#5d6b78;--line:#d5dde5;--bg:#f3f6f9;--card:#fff;--brand:#1f4e78;--brand2:#173a5a;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:var(--bg);line-height:1.5}
h1,h2,label,button,th,input,select,textarea,.sub{font-family:"Segoe UI",Arial,sans-serif}
header{background:var(--brand);color:#fff;padding:28px 20px}
header div,main{max-width:1100px;margin:0 auto}
h1{margin:0;font-size:1.7rem;font-weight:700}
.sub{margin:4px 0 0;opacity:.85;font-size:.95rem}
main{padding:20px}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px}
h2{margin:0 0 14px;font-size:1.15rem}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #aebbc7;border-radius:4px;font-size:.95rem;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:3px solid #7fb2e0;outline-offset:1px}
button{padding:10px 18px;border:0;border-radius:4px;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--brand);color:#fff}
button:hover{background:var(--brand2)}
button.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
button.alt:hover{background:#eaf1f8}
button.del{background:none;color:var(--danger);padding:4px 8px;font-weight:600}
button.del:hover{background:#fdecea}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar .grp{display:flex;gap:10px;flex-wrap:wrap}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:var(--brand);color:#fff;text-align:left;padding:9px 10px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.c{text-align:center}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.count{color:var(--muted);font-family:"Segoe UI",Arial,sans-serif;font-size:.9rem}
@media print{header,form,.bar,.del,.noprint{display:none}body{background:#fff}section{border:0;padding:0}}
</style>
</head>
<body>
<header><div>
  <h1>Campus Room Records</h1>
  <p class="sub">Add rooms by building and floor, then save the list as a PDF.</p>
</div></header>

<main>
<section>
  <h2>Add a record</h2>
  <form id="f">
    <div><label for="building">Building</label>
      <input id="building" list="blds" required placeholder="e.g. ICT Building">
      <datalist id="blds"></datalist></div>
    <div><label for="floor">Floor</label>
      <select id="floor"><option>1st Floor</option><option>2nd Floor</option><option>3rd Floor</option><option>4th Floor</option><option>Not specified</option></select></div>
    <div><label for="room">Room / Area</label>
      <input id="room" required placeholder="e.g. Room 201"></div>
    <div><label for="type">Room Type</label>
      <select id="type"><option>Classroom</option><option>Computer Laboratory</option><option>Office</option><option>Faculty Office</option><option>Server Room</option><option>Restroom</option><option>Library</option><option>Moot Court</option><option>Service Center</option><option>Other</option></select></div>
    <div><label for="cap">Room Capacity</label>
      <input id="cap" type="number" min="0" placeholder="Leave blank for N/A"></div>
    <div class="full"><label for="equip">Equipment</label>
      <textarea id="equip" placeholder="e.g. Whiteboard, projector, electric fans"></textarea></div>
    <div class="full"><button type="submit">Add record</button></div>
  </form>
</section>

<section>
  <div class="bar">
    <h2 style="margin:0">Records <span class="count" id="count"></span></h2>
    <div class="grp noprint">
      <button class="alt" id="clear" type="button">Clear all</button>
      <button id="pdf" type="button">Save as PDF</button>
    </div>
  </div>
  <div class="wrap">
    <table>
      <thead><tr><th>Building</th><th>Floor</th><th>Room / Area</th><th>Room Type</th><th>Capacity</th><th>Equipment</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
var KEY="campusRoomRecords", data=[];
try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){data=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var tb=document.getElementById("rows");
  if(!data.length){
    tb.innerHTML='<tr><td colspan="7" class="empty">No records yet. Fill in the form above and select Add record.</td></tr>';
  }else{
    tb.innerHTML=data.map(function(r,i){
      return "<tr><td>"+esc(r.building)+"</td><td>"+esc(r.floor)+"</td><td>"+esc(r.room)+"</td><td>"+esc(r.type)+
        '</td><td class="c">'+esc(r.cap)+"</td><td>"+esc(r.equip||"-")+
        '</td><td><button class="del" data-i="'+i+'" aria-label="Delete '+esc(r.room)+'">Delete</button></td></tr>';
    }).join("");
  }
  document.getElementById("count").textContent=data.length?"("+data.length+")":"";
  var names=[];data.forEach(function(r){if(names.indexOf(r.building)<0)names.push(r.building)});
  document.getElementById("blds").innerHTML=names.map(function(n){return '<option value="'+esc(n)+'">'}).join("");
}

document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  var cap=document.getElementById("cap").value.trim();
  data.push({
    building:document.getElementById("building").value.trim(),
    floor:document.getElementById("floor").value,
    room:document.getElementById("room").value.trim(),
    type:document.getElementById("type").value,
    cap:cap===""?"N/A":cap,
    equip:document.getElementById("equip").value.trim()
  });
  save();render();
  document.getElementById("room").value="";
  document.getElementById("cap").value="";
  document.getElementById("equip").value="";
  document.getElementById("room").focus();
});

document.getElementById("rows").addEventListener("click",function(e){
  var i=e.target.getAttribute("data-i");
  if(i!==null){data.splice(+i,1);save();render();}
});

document.getElementById("clear").addEventListener("click",function(){
  if(data.length&&confirm("Delete all records? This cannot be undone.")){data=[];save();render();}
});

document.getElementById("pdf").addEventListener("click",function(){
  if(!data.length){alert("Add at least one record before saving a PDF.");return;}
  if(!window.jspdf){window.print();return;}
  var doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"pt",format:"a4"});
  doc.setFontSize(16);doc.text("Campus Room Records",40,40);
  doc.setFontSize(9);doc.text("Generated "+new Date().toLocaleDateString(),40,56);
  doc.autoTable({
    startY:68,
    head:[["Building","Floor","Room / Area","Room Type","Capacity","Equipment"]],
    body:data.map(function(r){return [r.building,r.floor,r.room,r.type,r.cap,r.equip||"-"]}),
    styles:{fontSize:9,cellPadding:4},
    headStyles:{fillColor:[31,78,120]},
    columnStyles:{4:{halign:"center"}},
    margin:{left:40,right:40}
  });
  doc.save("campus-room-records.pdf");
});

render();
</script>
</body>
</html>
